apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: idp-platform

commonLabels:
  idp.academic/environment: dev

patches:
  - path: replica-patch.yaml
    target:
      kind: Deployment
      name: idp-backend

images:
  - name: ghcr.io/academic-idp/backend
    newTag: latest

apiVersion: apps/v1
kind: Deployment
metadata:
  name: idp-backend
  labels:
    app: idp-backend
    app.kubernetes.io/part-of: academic-idp
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: idp-backend
  template:
    metadata:
      labels:
        app: idp-backend
    spec:
      containers:
        - name: idp-backend
          image: ghcr.io/academic-idp/backend:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          envFrom:
            - secretRef:
                name: idp-backend-secrets
